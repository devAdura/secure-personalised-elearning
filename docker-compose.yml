services:
  postgres:
    image: postgres:16-alpine
    container_name: securelearn-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: secure_learning
    ports:
      - "5432:5432"
    volumes:
      - securelearn_postgres_data:/var/lib/postgresql/data

volumes:
  securelearn_postgres_data:
